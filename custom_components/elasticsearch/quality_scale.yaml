# Status of the Home Assistant Integration Quality Scale rules for this integration.
# https://contributors.home-assistant.io/core/quality-scale/rules/
#
# Hassfest only validates this file for integrations in Home Assistant Core, so nothing
# enforces it here. Keep it accurate by hand, and only raise `quality_scale` in
# manifest.json once every rule in that tier and the tiers below it is done or exempt.
rules:
  # Bronze
  action-setup:
    status: done
    comment: >-
      elasticsearch.query is registered in async_setup, so it exists whether or not an entry is
      loaded. It checks the entry it's given, and fails with a translated error if it isn't loaded.
  appropriate-polling:
    status: done
    comment: Home Assistant's own state machine is polled, every 60 seconds by default.
  brands: done
  common-modules:
    status: exempt
    comment: The integration has no coordinator or base entity.
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: >-
      elasticsearch is Apache-2.0, on PyPI, and tagged in elastic/elasticsearch-py. 9.5.0 and
      later are published by the pypi-publish.yml workflow in that repository, with PyPI
      provenance. The client asks for REST API compatibility with 8, so 8.x clusters still work.
  docs-actions:
    status: done
    comment: docs/querying.md documents elasticsearch.query, its fields, and its response.
  docs-conditions:
    status: exempt
    comment: The integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide any triggers.
  entity-event-setup:
    status: exempt
    comment: The integration does not create any entities.
  entity-unique-id:
    status: exempt
    comment: The integration does not create any entities.
  has-entity-name:
    status: exempt
    comment: The integration does not create any entities.
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: >-
      elasticsearch.query raises ServiceValidationError for problems with the query or its
      result, and HomeAssistantError when Elasticsearch fails or can't be reached.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: exempt
    comment: The integration does not create any entities.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      The integration has no entities, so this applies to the Elasticsearch connection. Losing
      it, and failing to publish while it is up, are each logged once, as is recovering.
  parallel-updates:
    status: exempt
    comment: The integration does not create any entities.
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices:
    status: exempt
    comment: The integration does not create any devices.
  diagnostics:
    status: done
    comment: >-
      Includes the cluster's version and build flavor, the last connection check, and the queue
      size. Credentials are redacted, including any embedded in the URL.
  discovery:
    status: exempt
    comment: Elasticsearch does not advertise itself on the network.
  discovery-update-info:
    status: exempt
    comment: Elasticsearch does not advertise itself on the network.
  docs-data-update:
    status: done
    comment: >-
      docs/publishing.md documents how data is gathered and published, and what happens during
      an outage. Data is only fetched when elasticsearch.query is called, which docs/querying.md
      documents.
  docs-examples:
    status: done
    comment: docs/querying.md has automation and script examples for elasticsearch.query.
  docs-known-limitations:
    status: done
    comment: Known limitations are in docs/publishing.md, and those of querying in docs/querying.md.
  docs-supported-devices: done
  docs-supported-functions:
    status: done
    comment: docs/published_fields.md documents the fields each document contains.
  docs-troubleshooting:
    status: done
    comment: docs/troubleshooting.md.
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: The integration does not create any devices.
  entity-category:
    status: exempt
    comment: The integration does not create any entities.
  entity-device-class:
    status: exempt
    comment: The integration does not create any entities.
  entity-disabled-by-default:
    status: exempt
    comment: The integration does not create any entities.
  entity-translations:
    status: exempt
    comment: The integration does not create any entities.
  exception-translations:
    status: done
    comment: >-
      Every exception raised during setup and by elasticsearch.query is translated. The
      exceptions in errors.py are caught internally, and either raised as one of those or shown
      as a translated config flow error.
  icon-translations:
    status: done
    comment: The integration creates no entities. icons.json gives elasticsearch.query its icon.
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: >-
      Issues are raised when two entries publish to the same cluster, and when the cluster's
      version is unsupported, and removed once the condition clears. A publish interval of 0 does
      not raise one, because the options document it as the way to turn publishing off.
  stale-devices:
    status: exempt
    comment: The integration does not create any devices.

  # Platinum
  async-dependency: done
  inject-websession:
    status: todo
    comment: elastic-transport creates its own aiohttp session.
  strict-typing:
    status: todo
    comment: ElasticIntegrationConfigEntry is not used throughout.
