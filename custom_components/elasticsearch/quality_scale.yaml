# Status of the Home Assistant Integration Quality Scale rules for this integration.
# https://contributors.home-assistant.io/core/quality-scale/rules/
#
# Hassfest only validates this file for integrations in Home Assistant Core, so nothing
# enforces it here. Keep it accurate by hand, and only raise `quality_scale` in
# manifest.json once every rule in that tier and the tiers below it is done or exempt.
rules:
  # Bronze
  action-setup:
    status: done
    comment: >-
      elasticsearch.query is registered in async_setup, so it exists whether or not an entry is
      loaded. It checks the entry it's given, and fails with a translated error if it isn't loaded.
  appropriate-polling:
    status: done
    comment: >-
      Query coordinators default to 60 seconds, with 10–86400 second bounds. Publishing polling remains independent.
  brands: done
  common-modules:
    status: done
    comment: >-
      coordinator.py implements per-query DataUpdateCoordinator instances; sensor.py uses CoordinatorEntity.
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: tests/test_config_flow.py and tests/test_sensor_config_flow.py cover connection and subentry flows, including recovery.
  dependency-transparency:
    status: done
    comment: >-
      elasticsearch is Apache-2.0, on PyPI, and tagged in elastic/elasticsearch-py. 9.5.0 and
      later are published by the pypi-publish.yml workflow in that repository, with PyPI
      provenance. The client asks for REST API compatibility with 8, so 8.x clusters still work.
  docs-actions:
    status: done
    comment: docs/querying.md documents elasticsearch.query, its fields, and its response.
  docs-conditions:
    status: exempt
    comment: The integration does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide any triggers.
  entity-event-setup:
    status: done
    comment: >-
      Coordinator listeners and source-expiry timers are registered on add and removed on entity unload.
  entity-unique-id:
    status: done
    comment: >-
      Saved subentry IDs identify entities independently of their query, name, or selected column.
  has-entity-name:
    status: done
    comment: >-
      Query sensors set has_entity_name and use the user-provided subentry title.
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: >-
      elasticsearch.query raises ServiceValidationError for problems with the query or its
      result, and HomeAssistantError when Elasticsearch fails or can't be reached.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: >-
      Query, mapping, permissions and freshness failures mark only the affected sensor unavailable. Empty/null are unknown.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      Coordinators log failures and recovery once per transition, including source-expiry timers. Error messages omit query data.
  parallel-updates:
    status: done
    comment: >-
      Sensor PARALLEL_UPDATES is zero; coordinators serialize polls and the shared query runner limits active requests to four.
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices:
    status: done
    comment: >-
      All saved sensors attach to one cluster-UUID service device owned by the parent connection.
  diagnostics:
    status: done
    comment: >-
      Runtime diagnostics include per-query status and timings, without names, query text, parameters, columns or results. Connection credentials are redacted.
  discovery:
    status: exempt
    comment: Elasticsearch does not advertise itself on the network.
  discovery-update-info:
    status: exempt
    comment: Elasticsearch does not advertise itself on the network.
  docs-data-update:
    status: done
    comment: >-
      docs/query_sensors.md documents polling, bounds, source freshness and recovery; publishing and action behavior retain their own documentation.
  docs-examples:
    status: done
    comment: >-
      docs/querying.md contains automation examples; docs/query_sensors.md has latest-observation and aggregate sensor examples.
  docs-known-limitations:
    status: done
    comment: Known limitations are in docs/publishing.md, and those of querying in docs/querying.md.
  docs-supported-devices: done
  docs-supported-functions:
    status: done
    comment: docs/published_fields.md documents the fields each document contains.
  docs-troubleshooting:
    status: done
    comment: docs/troubleshooting.md.
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: >-
      Adding a query subentry reloads the connection and creates the service device without restarting Home Assistant.
  entity-category:
    status: done
    comment: >-
      User-created query sensors are primary entities and have no diagnostic or configuration category.
  entity-device-class:
    status: done
    comment: >-
      Optional explicit sensor device classes, compatible units and state classes are validated before saving and on each reading.
  entity-disabled-by-default:
    status: done
    comment: >-
      User-created sensors are enabled by default. Disabled sensors have no recurring coordinator polls.
  entity-translations:
    status: exempt
    comment: >-
      Names are supplied by users, the documented user-defined-name exception. Integration-provided flow, error and Repair text is translated.
  exception-translations:
    status: done
    comment: >-
      Every exception raised during setup and by elasticsearch.query is translated. The
      exceptions in errors.py are caught internally, and either raised as one of those or shown
      as a translated config flow error.
  icon-translations:
    status: done
    comment: >-
      icons.json defines the query sensor icon and the query action icon; explicit device classes use Home Assistant defaults.
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: >-
      Persistent query mapping, permission, syntax and version problems create translated Repairs; successful polling or removal clears them. Existing cluster Repairs remain.
  stale-devices:
    status: done
    comment: >-
      Removing the last saved query removes the service device on reload. Orphan service devices can be removed explicitly; active devices cannot.
  # Platinum
  async-dependency: done
  inject-websession:
    status: todo
    comment: elastic-transport creates its own aiohttp session.
  strict-typing:
    status: todo
    comment: ElasticIntegrationConfigEntry is not used throughout.
